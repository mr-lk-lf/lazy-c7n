[package]
name = "lazyc7n"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for the Cloud Custodian (custodian) CLI"
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cloud-custodian", "c7n", "tui", "ratatui", "cloud"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
